[project]
name = "aegis-context"
version = "0.1.0"
description = "Local-first ambient screen-context memory: capture, embed, store, recall."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
capture = ["mss>=9.0", "pillow>=10.0"]
hud = ["PyQt5>=5.15", "pynput>=1.7"]
onnx = ["onnxruntime>=1.17", "tokenizers>=0.15"]

[project.scripts]
aegis = "aegis_context.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
